shared:
    image: node:22
    steps:
      - echo: echo hoge

jobs:
  job1:
    requires: [~commit]

  job2:
    requires: [~commit]
    steps:
      - sleep 60

  vjob1:
    requires: [~job1]
    annotations:
      screwdriver.cd/virtualJob: true
    blockedBy: [ ~job2 ]

  vjob2:
    requires: [ ~job1 ]
    annotations:
      screwdriver.cd/virtualJob: true
