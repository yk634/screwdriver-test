shared:
  image: node:22

jobs:
  default-checkout:
    requires: [~commit, ~pr]
    steps:
      - verify: |
          echo "PWD=$PWD"
          test "$(basename "$PWD")" = "for'bar"

  skip-checkout:
    requires: [~commit]
    environment:
      SD_SKIP_REPOSITORY_CLONE: true
    steps:
      - verify: |
          echo "PWD=$PWD"
          test "$(basename "$PWD")" = "for'bar"
